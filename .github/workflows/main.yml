name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect Secrets
    uses: ./.github/workflows/_detect-secrets.yml

  code-qa:
    name: Code QA
    needs: [detect-secrets]
    uses: ./.github/workflows/_code-qa.yml

  release:
    name: Release
    needs: [code-qa]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Auth for git commands later in the job (commit, tag, push)
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Release
        env:
          # Auth for GitHub REST API (create release, comment on issues/PRs)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Override @semantic-release/git's default "semantic-release-bot" author
          GIT_AUTHOR_NAME: Andrei Dumitrescu
          GIT_AUTHOR_EMAIL: 5057797+andreidmt@users.noreply.github.com
          GIT_COMMITTER_NAME: Andrei Dumitrescu
          GIT_COMMITTER_EMAIL: 5057797+andreidmt@users.noreply.github.com
        run: npx semantic-release
